[package]
name = "dev-flaky"
version = "0.9.1"
edition = "2021"
rust-version = "1.85"
readme = "README.md"
license = "Apache-2.0"

authors = [
    "James Gober <me@jamesgober.com>"
]

description = "Flaky test detection for Rust. Runs cargo test N times and classifies each test as stable / flaky / broken with a reliability score in [0.0, 1.0]. Part of the dev-* verification collection."

keywords = [
    "flaky",
    "test",
    "reliability",
    "retry",
    "ci"
]

categories = [
    "development-tools",
    "development-tools::testing"
]

documentation = "https://docs.rs/dev-flaky"
repository = "https://github.com/jamesgober/dev-flaky"
homepage = "https://github.com/jamesgober/dev-flaky"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
dev-report = { version = "0.9", path = "../dev-report" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

[features]
default = []

[profile.release]
opt-level = 3
lto = "thin"
